<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f3f2ef;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .modal {
      background: #ffffff;
      width: 440px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      text-align: center;
      border: 1px solid #e0e0e0;
    }
    .logo {
      color: #0a66c2;
      font-weight: bold;
      font-size: 24px;
      margin-bottom: 16px;
    }
    h2 {
      font-size: 20px;
      color: #181818;
      margin-bottom: 8px;
    }
    p {
      color: #666666;
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 24px;
    }
    .btn-primary {
      background-color: #0a66c2;
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 24px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .btn-optout {
      background: none;
      border: none;
      color: #666666;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="modal">
    <div class="logo">Linked<span style="background:#0a66c2;color:white;padding:0 4px;border-radius:2px;">in</span></div>
    <h2>Unlock Your Career Potential with Premium</h2>
    <p>Get 2x more profile views, direct InMail messaging to recruiters, and exclusive salary insights.</p>
    <button class="btn-primary">Try 1 Month Free</button>
    <br>
    <button class="btn-optout">No thanks, I don't want to grow my career</button>
  </div>
</body>
</html>
